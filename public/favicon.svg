<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#090E17"/>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="url(#cyber)" stroke-width="2"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#glow)" opacity="0.8"/>
  <polygon points="50,28 69,61 31,61" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="6" fill="#00F0FF"/>
</svg>
