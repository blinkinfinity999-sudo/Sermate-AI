name: Build Desktop App

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Web Application & Server
        run: |
          npm run build

      - name: Verify Build Output
        run: |
          ls -la dist/

      - name: Package Windows Installer & Portable Executable
        run: |
          npx --yes electron-builder --win --x64 --publish never -c.npmRebuild=false -c.nodeGypRebuild=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sermate-AI-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yaml
          retention-days: 30
          if-no-files-found: warn
